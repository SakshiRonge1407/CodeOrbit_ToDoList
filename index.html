<!doctype html><html lang="en">
    <head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow To-do List</title>
        <link rel="stylesheet" href="style.css"></head><body><main class="app">
            <header><p class="eyebrow">MAKE SPACE FOR WHAT MATTERS</p>
            <h1>TaskFlow<span>.</span></h1><p>A calmer way to get things done.</p>
            </header><div class="stats"><div><b id="total">0</b><span>Total</span>
            </div><div><b id="active">0</b><span>Remaining</span></div><div><b id="done">0</b>
                <span>Completed</span></div></div><form id="taskForm">
                <input id="taskInput" maxlength="120" placeholder="What needs to get done?" required aria-label="New task">
                <select id="priority" aria-label="Priority"><option value="normal">Normal</option>
                <option value="high">High priority</option><option value="low">Low priority</option>
                </select><button class="primary">＋ Add task</button></form><div class="toolbar"><div><button class="filter selected" data-filter="all">All</button>
                <button class="filter" data-filter="active">Active</button><button class="filter" data-filter="completed">Completed</button>
                </div><button id="clear">Clear completed</button></div><ul id="list" aria-live="polite"></ul><div id="empty"><strong>✓</strong><h2>You're all caught up</h2>
                <p>Add a task above to start your list.</p></div><footer>Tasks are saved in this browser using localStorage.</footer><dialog id="editor">
                    <form id="editForm"><h2>Edit task</h2><input id="editTitle" required maxlength="120" aria-label="Task title"><select id="editPriority" aria-label="Task priority">
                        <option value="normal">Normal</option><option value="high">High priority</option><option value="low">Low priority</option>
                        </select><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save changes</button></div>
                        </form></dialog></main><script src="script.js">

        </script></body></html>
